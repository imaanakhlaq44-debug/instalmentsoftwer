org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where a freshly installed handset looks for the API when the enrolment QR
# does not carry a server URL of its own. 10.0.2.2 is the host machine as seen
# from the Android emulator; override it for a real deployment.
emishield.defaultServerUrl=http://10.0.2.2:5000/api/dpc

# Where the shop's relay phone looks for the outbox when the pairing code does
# not carry a server URL of its own.
emishield.defaultRelayUrl=http://10.0.2.2:5000/api/sms-relay
