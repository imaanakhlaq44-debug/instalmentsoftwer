org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where a freshly installed handset looks for the API when the enrolment QR
# does not carry a server URL of its own. 10.0.2.2 is the host machine as seen
# from the Android emulator; override it for a real deployment.
#
# The prefix moved with the package rename. Both builds read `almassdm.*`, and
# these keys kept the old name for a commit — so the override silently did
# nothing and every build fell back to the emulator address, including a
# release build meant for a real server.
almassdm.defaultServerUrl=http://10.0.2.2:5000/api/dpc

# Where the shop's relay phone looks for the outbox when the pairing code does
# not carry a server URL of its own.
almassdm.defaultRelayUrl=http://10.0.2.2:5000/api/sms-relay
