name: Build shop app
on:
  push:
    branches: ['feature/shop-app-20261117']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore existing company signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALMAS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Test, inspect and sign shop application
        working-directory: android
        env:
          ALMAS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ALMAS_KEYSTORE_PASSWORD: ${{ secrets.ALMAS_KEYSTORE_PASSWORD }}
          ALMAS_KEY_ALIAS: ${{ secrets.ALMAS_KEY_ALIAS }}
          ALMAS_KEY_PASSWORD: ${{ secrets.ALMAS_KEY_PASSWORD }}
          ALMAS_SHOP_QA_OUTPUT: ${{ runner.temp }}/shop-previews
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :shop:testDirectDebugUnitTest :shop:testPlayDebugUnitTest :shop:lintDirectRelease :shop:lintPlayRelease :shop:assembleDirectRelease :shop:assemblePlayRelease :shop:bundlePlayRelease
      - uses: actions/upload-artifact@v4
        with:
          name: almas-sdm-shop-1.0.0-signed
          path: |
            android/shop/build/outputs/apk/direct/release/shop-direct-release.apk
            android/shop/build/outputs/apk/play/release/shop-play-release.apk
            android/shop/build/outputs/bundle/playRelease/shop-play-release.aab
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-native-screens-and-reports
          path: |
            ${{ runner.temp }}/shop-previews/
            android/shop/build/reports/tests/
            android/shop/build/reports/lint-results-*.html
          retention-days: 14
