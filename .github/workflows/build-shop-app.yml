name: Build shop app

# Run by hand from the Actions tab (or `gh workflow run`) to get the signed shop
# app: the Play Store bundle (.aab) and the direct-download APK.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the company signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALMAS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Test and sign the shop app
        working-directory: android
        env:
          ALMAS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ALMAS_KEYSTORE_PASSWORD: ${{ secrets.ALMAS_KEYSTORE_PASSWORD }}
          ALMAS_KEY_ALIAS: ${{ secrets.ALMAS_KEY_ALIAS }}
          ALMAS_KEY_PASSWORD: ${{ secrets.ALMAS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :shop:testPlayDebugUnitTest :shop:bundlePlayRelease :shop:assembleDirectRelease
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: almas-sdm-shop-signed
          path: |
            android/shop/build/outputs/bundle/playRelease/shop-play-release.aab
            android/shop/build/outputs/apk/direct/release/shop-direct-release.apk
          if-no-files-found: error
          retention-days: 14
