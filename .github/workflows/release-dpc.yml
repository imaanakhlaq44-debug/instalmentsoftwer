name: Release DPC

# Cutting a tag is what publishes a handset build.
#
# The APK is hosted on the GitHub Release rather than on the shop's own server,
# because a factory-reset phone downloads it during setup, before it has been
# given any credentials — so the host has to be HTTPS, publicly reachable, and
# up at 11pm on a Sunday when a customer is being handed a phone. That is a
# poor fit for a small shop's box and a good fit for a release asset.
#
#     git tag dpc-v1.0.0 && git push origin dpc-v1.0.0
#
# The tag name is the label; `versionCode` and `versionName` in
# dpc/build.gradle.kts are what the handset actually reports, and they have to
# be raised in the same commit. See android/RELEASE.md.

on:
  push:
    tags: ['dpc-v*']
  # Runnable by hand to check that the key and the secrets are wired up. The
  # build and the checksum work from any ref; only the publish step needs a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish the DPC
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # A release APK that fails its own unit tests is not a release.
      - name: Test
        working-directory: android
        run: ./gradlew --no-daemon :dpc:testDebugUnitTest

      # The key never exists as a file in the repository. It is stored as a
      # base64 secret, written to the runner's disk for the length of the build,
      # and goes with the runner when it is destroyed.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALMAS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ALMAS_KEYSTORE_BASE64 is not set. See android/RELEASE.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        working-directory: android
        env:
          ALMAS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ALMAS_KEYSTORE_PASSWORD: ${{ secrets.ALMAS_KEYSTORE_PASSWORD }}
          ALMAS_KEY_ALIAS: ${{ secrets.ALMAS_KEY_ALIAS }}
          ALMAS_KEY_PASSWORD: ${{ secrets.ALMAS_KEY_PASSWORD }}
          # Only the fallback for the typed enrolment form — a provisioned phone
          # takes its server address from the QR. Set the repository variable
          # DPC_DEFAULT_SERVER_URL to point hand-enrolled handsets at production.
          DEFAULT_SERVER_URL: ${{ vars.DPC_DEFAULT_SERVER_URL }}
        run: |
          ARGS=""
          if [ -n "$DEFAULT_SERVER_URL" ]; then
            ARGS="-Palmassdm.defaultServerUrl=$DEFAULT_SERVER_URL"
          fi
          ./gradlew --no-daemon :dpc:assembleRelease $ARGS

      # The value the provisioning QR carries. Printed into the release notes so
      # that whoever configures the server copies it from the build that
      # produced the APK, rather than from a note somebody typed by hand.
      - name: Read the certificate checksum
        id: checksum
        working-directory: android
        env:
          ALMAS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ALMAS_KEYSTORE_PASSWORD: ${{ secrets.ALMAS_KEYSTORE_PASSWORD }}
          ALMAS_KEY_ALIAS: ${{ secrets.ALMAS_KEY_ALIAS }}
          ALMAS_KEY_PASSWORD: ${{ secrets.ALMAS_KEY_PASSWORD }}
        run: |
          # Not `-q`: the task prints at Gradle's lifecycle level, which quiet
          # suppresses, and the grep below would then find nothing.
          VALUE=$(./gradlew --no-daemon :dpc:printSigningCertChecksum \
            | grep '^DPC_APK_SIGNATURE_CHECKSUM=' | cut -d= -f2)
          if [ -z "$VALUE" ]; then
            echo "::error::Could not read the signing certificate checksum."
            exit 1
          fi
          echo "checksum=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Name the APK after its version
        id: apk
        run: |
          SOURCE=android/dpc/build/outputs/apk/release/dpc-release.apk
          NAME="almas-sdm-dpc-${GITHUB_REF_NAME#dpc-}.apk"
          cp "$SOURCE" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.apk.outputs.path }}
          name: DPC ${{ github.ref_name }}
          body: |
            The Device Policy Controller for a customer's handset.

            **Configure the server with these before printing an enrolment QR:**

            ```
            DPC_APK_URL=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.apk.outputs.path }}
            DPC_APK_SIGNATURE_CHECKSUM=${{ steps.checksum.outputs.checksum }}
            ```

            The checksum is the SHA-256 of the signing certificate, base64url
            encoded. A factory-reset phone downloads the APK from that URL during
            setup and refuses to install it unless it matches — which is what
            stops a lookalike being provisioned as the owner of somebody's phone.

            APK SHA-256 (file integrity, not the provisioning value):
            `${{ steps.apk.outputs.sha256 }}`
