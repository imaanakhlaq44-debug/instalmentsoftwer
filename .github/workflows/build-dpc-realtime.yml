name: Build realtime DPC APK
on:
  push:
    branches: ['feature/dpc-realtime-20261118']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALMAS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Test and sign existing application
        working-directory: android
        env:
          ALMAS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ALMAS_KEYSTORE_PASSWORD: ${{ secrets.ALMAS_KEYSTORE_PASSWORD }}
          ALMAS_KEY_ALIAS: ${{ secrets.ALMAS_KEY_ALIAS }}
          ALMAS_KEY_PASSWORD: ${{ secrets.ALMAS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :dpc:testDebugUnitTest :dpc:lintRelease :dpc:assembleRelease :dpc:verifyReleaseSigned :dpc:printSigningCertChecksum -Palmassdm.defaultServerUrl=https://app.almassdm.pro/api/dpc
      - uses: actions/upload-artifact@v4
        with:
          name: almas-sdm-dpc-1.7.0-signed
          path: android/dpc/build/outputs/apk/release/dpc-release.apk
          if-no-files-found: error
          retention-days: 7
